services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  cnn-worker:
    build: ./cnn-worker
    ports: ["8000:8000"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      cnn-worker: { condition: service_started }
    volumes:
      - uploads:/data/uploads
    ports: ["4000:4000"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  uploads:
